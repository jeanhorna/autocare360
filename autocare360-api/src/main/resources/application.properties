spring.application.name=autocare360-api

# ===== Base de datos SQL Server =====
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BDAutoCare360;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Servidor =====
server.port=8080

# ===== Parametros del negocio (motor de reservas) =====
app.reserva.hora-apertura=08:00
app.reserva.hora-cierre=18:00
app.reserva.intervalo-minutos=30

# Zona horaria del taller (usada por el motor de reservas)
app.zona-horaria=America/Lima

# ===== Seguridad JWT =====
# Clave Base64 de minimo 32 bytes. En produccion definir la variable de entorno JWT_SECRET
app.jwt.secret=${JWT_SECRET:QXV0b0NhcmUzNjAtQ2xhdmUtU2VjcmV0YS1KV1QtMjAyNi1DYW1iaWFyRW5Qcm9kdWNjaW9uIQ==}
app.jwt.expiracion-minutos=120

# ===== CORS (frontend Angular) =====
app.cors.allowed-origins=http://localhost:4200

# ===== Administrador inicial (se crea al arrancar si no existe) =====
app.admin.correo=admin@autocare360.pe
app.admin.password=${ADMIN_PASSWORD:Admin123*}
app.admin.nombre=Administrador
app.admin.apellido=AutoCare360